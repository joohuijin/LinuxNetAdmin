# Global parameters
[global]
	log file = /var/log/samba/log.%m
	max log size = 50
	security = USER
	server string = server1
	idmap config * : backend = tdb
	cups options = raw
	hosts allow = 127. 192.168.10. 192.168.20.


[homes]
	browseable = No
	comment = Home Directories
	read only = No


[printers]
	browseable = No
	comment = All Printers
	path = /var/tmp
	printable = Yes


[public]
	comment = Samba Test
	guest ok = Yes
	path = /samba
	read only = No
	valid users = smbuser1 smbuser2


[test1]
	comment = WriteList Test
	path = /smbshare
	write list = @marketing
